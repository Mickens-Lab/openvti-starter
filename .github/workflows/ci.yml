# Continuous integration: typecheck and the full test suite on every push to main and every pull request.
# No Docker, no network services and no secrets are needed (the tests use fakes and local servers).
# Node is pinned to the 22.x release the jsdom UI tests (collab-room) were verified on: Node 22.15 fails them
# with a SubtleCrypto/jsdom error. Bump it deliberately.
# STATUS: written and YAML-checked locally, not yet run on GitHub; the first run is the real test.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
